owner: &owner U_OWNER_ID

slack:
  app_token: {env: SLACK_APP_TOKEN}
  bot_token: {env: SLACK_BOT_TOKEN}
  # Optional read token. Choose env or file for each token.
  # user_token: {file: secrets/slack-user-token}
  group_refresh_interval: 1h

conversations:
  direct_messages:
    users: [*owner]
  rules:
    - id: C_CHANNEL_ID
      users: [*owner]
      groups: [S_USER_GROUP_ID]
      allow_bots: false
      require_mention: true

model:
  executable: claude
  name: haiku
  idle_timeout: 1h
  turn_timeout: 2h
  # Defaults to work/ beside the database, created with mode 0700.
  # Keep config, database, token files, and memory outside this directory.
  workdir: work

memory:
  dir: memory
  limits:
    core_bytes: 8192
    file_bytes: 65536
    total_bytes: 1048576
    file_count: 128

database:
  path: noctiluca.db

toolhub:
  listen: 127.0.0.1:0

tasks:
  # Deadline for background task turns.
  timeout: 30m

heartbeat:
  enabled: true
  interval: 1h

consolidate:
  enabled: false
  cron: '0 4 * * *'
  tz: UTC
  negative_reactions: ['-1', thumbsdown]

cron: []
# cron:
#   - name: morning
#     cron: '0 9 * * *'
#     tz: UTC
#     prompt: Read procedures/morning.md and follow it.
#     workdir: /path/to/project

mcp_servers: []
# mcp_servers:
#   - name: tracker
#     url: https://tracker.example/mcp
#     scopes: [read, offline_access]
#     members: true  # Optional. External tools otherwise require the owner.
#     tools: [search]

log:
  level: INFO
