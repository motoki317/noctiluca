messaging:
  - name: slack
    type: slack
    owner: U_OWNER_ID
    slack:
      app_token: {env: SLACK_APP_TOKEN}
      bot_token: {env: SLACK_BOT_TOKEN}
      # Optional read token. Choose env or file for each token.
      # user_token: {file: secrets/slack-user-token}
      group_refresh_interval: 1h
    trust:
      users: [U_FRIEND_ID]
      groups: [S_USER_GROUP_ID]
    # Optional, rarely needed overrides by channel ID. An override's trust
    # replaces the entry's trust there.
    # conversations:
    #   - id: C_NOISY_CHANNEL_ID
    #     ignore: true
    #   - id: C_SUPPORT_CHANNEL_ID
    #     require_mention: true
    #   - id: C_ALERTS_CHANNEL_ID
    #     trust: {groups: [S_USER_GROUP_ID], bots: [U_ALERT_BOT_ID]}
  # - name: discord
  #   type: discord
  #   owner: DISCORD_OWNER_USER_ID
  #   discord:
  #     token: {env: DISCORD_BOT_TOKEN}
  #   trust: {groups: [DISCORD_ROLE_ID]}
  # - name: traq
  #   type: traq
  #   owner: TRAQ_OWNER_USER_UUID
  #   traq:
  #     origin: https://q.example.com
  #     access_token: {env: TRAQ_BOT_ACCESS_TOKEN}
  #   trust: {groups: [TRAQ_GROUP_UUID]}

model:
  type: claude  # or codex; executable defaults to the type name
  name: haiku  # with codex: a Codex model name, or omit for Codex's default
  # reasoning_effort: medium  # codex only
  idle_timeout: 1h
  turn_timeout: 2h
  # Defaults to work/ beside the database, created with mode 0700.
  # Keep config, database, token files, and memory outside this directory.
  workdir: work

memory:
  dir: memory

database:
  path: noctiluca.db

toolhub:
  listen: 127.0.0.1:0

tasks:
  # Deadline for background task turns.
  timeout: 30m

heartbeat:
  enabled: true
  interval: 1h

consolidate:
  enabled: false
  cron: '0 4 * * *'
  tz: UTC
  negative_reactions: ['-1', thumbsdown]

cron: []
# cron:
#   - name: morning
#     cron: '0 9 * * *'
#     tz: UTC
#     prompt: Read procedures/morning.md and follow it.
#     workdir: /path/to/project

mcp_servers: []
# mcp_servers:
